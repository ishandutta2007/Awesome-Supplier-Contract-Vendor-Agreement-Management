<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#0f1f38" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Interactive Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Embedded Dynamic Keyframe Styles -->
    <style>
      .pulse-dot {
        animation: pulseAnimation 2s infinite ease-in-out;
      }
      .pulse-ring {
        animation: ringAnimation 2.2s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
        transform-origin: 44px 45px;
      }
      @keyframes pulseAnimation {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.15); opacity: 0.8; }
      }
      @keyframes ringAnimation {
        0% { transform: scale(0.85); opacity: 0.85; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      .flow-pulse {
        stroke-dasharray: 8, 8;
        animation: dashFlow 20s linear infinite;
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -1000; }
      }
      .contract-bar {
        animation: barFade 3.5s ease-in-out infinite alternate;
      }
      @keyframes barFade {
        0% { opacity: 0.65; }
        100% { opacity: 1; }
      }
      .card-float {
        animation: floatCard 6s ease-in-out infinite alternate;
      }
      @keyframes floatCard {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- High-Tech Engineering Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Glowing Ambient Background Orbs -->
  <circle cx="140" cy="70" r="150" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1060" cy="290" r="170" fill="#c084fc" opacity="0.08" filter="url(#glow)"/>
  <circle cx="620" cy="180" r="210" fill="#818cf8" opacity="0.05" filter="url(#glow)"/>

  <!-- Dynamic Animated Contract Flow Line in Background -->
  <path class="flow-pulse" d="M -50 290 L 170 290 L 210 240 L 240 320 L 270 270 L 300 290 L 510 290 L 540 250 L 570 310 L 600 290 L 840 290 L 870 240 L 900 330 L 930 260 L 960 290 L 1250 290" 
        fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.35" />

  <!-- Animated Interactive / Vendor Governance Card on Right Side -->
  <g class="card-float" transform="translate(730, 45)" filter="url(#card-shadow)">
    <!-- Main Card Body -->
    <rect width="410" height="268" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Status Header Badge -->
    <rect x="22" y="24" width="366" height="42" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.2" />
    <circle cx="44" cy="45" r="7" fill="#34d399" class="pulse-dot" />
    <circle cx="44" cy="45" r="7" fill="none" stroke="#34d399" stroke-width="2" class="pulse-ring" />
    <text x="64" y="50" font-size="13.5" font-weight="700" fill="#6ee7b7" letter-spacing="0.5">VENDOR OBLIGATIONS ACTIVE</text>
    <text x="350" y="50" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="end">100% SLA</text>

    <!-- Contract Operations Monitor -->
    <g transform="translate(24, 86)">
      <!-- Item 1: Contract Lifecycle Management -->
      <text x="0" y="16" font-size="13" font-weight="600" fill="#cbd5e1">AI Clause Extraction &amp; Review</text>
      <text x="362" y="16" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="end">Synced</text>
      <!-- Activity Indicators -->
      <g transform="translate(0, 24)" class="contract-bar">
        <rect x="0" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="12" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="24" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="36" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="48" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
