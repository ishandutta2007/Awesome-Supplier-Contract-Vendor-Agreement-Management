        <rect x="288" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="300" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="312" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="324" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="336" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="348" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="360" y="0" width="8" height="15" rx="2" fill="#818cf8"/>
      </g>
    </g>

    <g transform="translate(24, 150)">
      <!-- Item 2: TPRM & Risk Governance -->
      <text x="0" y="16" font-size="13" font-weight="600" fill="#cbd5e1">Supplier Risk &amp; Milestones (TPRM)</text>
      <text x="362" y="16" font-size="12" font-weight="600" fill="#10b981" text-anchor="end">Compliant</text>
      <g transform="translate(0, 24)" class="contract-bar">
        <rect x="0" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="12" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="24" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="36" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="48" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="60" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="72" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="84" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="96" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="108" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="120" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="132" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="144" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="156" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="168" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="180" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="192" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="204" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="216" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="228" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="240" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="252" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="264" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="276" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="288" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="300" y="0" width="8" height="15" rx="2" fill="#818cf8"/>
        <rect x="312" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="324" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="336" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="348" y="0" width="8" height="15" rx="2" fill="#10b981"/>
        <rect x="360" y="0" width="8" height="15" rx="2" fill="#34d399"/>
      </g>
    </g>

    <g transform="translate(24, 214)">
      <rect width="362" height="34" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="16" cy="17" r="4" fill="#10b981"/>
      <text x="28" y="21" font-size="11" fill="#94a3b8">ERP 3-way match verified • 0 off-contract spend incidents</text>
    </g>
  </g>

  <!-- Left Foreground Typography & Identity -->
  <g transform="translate(60, 68)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="224" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="14" y="18" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="80" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
      Supplier Contract <tspan fill="url(#primary-glow)">&amp;</tspan>
    </text>
    <text x="0" y="132" font-size="42" font-weight="900" fill="url(#primary-glow)" letter-spacing="-0.8">
      Vendor Management
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="174" font-size="15.5" font-weight="500" fill="#94a3b8">
      Enterprise SaaS CLM, Source-to-Pay (S2P) &amp; Open-Source
    </text>
    <text x="0" y="198" font-size="15.5" font-weight="500" fill="#94a3b8">
      Solutions for Contract Lifecycle, Obligation Sync &amp; TPRM.
    </text>

    <!-- Visual Feature Badges / Pills -->
    <g transform="translate(0, 226)">
      <rect x="0" y="0" width="134" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="14" y="18" font-size="12" font-weight="600" fill="#cbd5e1">📑 Enterprise CLM</text>

      <rect x="144" y="0" width="154" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="156" y="18" font-size="12" font-weight="600" fill="#cbd5e1">🏢 Vendor Governance</text>

      <rect x="308" y="0" width="144" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="320" y="18" font-size="12" font-weight="600" fill="#cbd5e1">🔓 10+ Open Source</text>
    </g>
