        <rect x="72" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="84" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="96" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="108" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
        <rect x="120" y="0" width="8" height="15" rx="2" fill="#38bdf8"/>
